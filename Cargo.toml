[workspace]
resolver = "2"
members = [
    "crates/evos-core",
    "crates/evos-scan",
    "crates/evos-mount",
    "crates/evos-proto",
    "crates/evosd",
    "crates/evos-cli",
    "crates/evos-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["doriav <doriav20@gmail.com>"]

[workspace.dependencies]
evos-core = { path = "crates/evos-core" }
evos-scan = { path = "crates/evos-scan" }
evos-mount = { path = "crates/evos-mount" }
evos-proto = { path = "crates/evos-proto" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
debug = true
