[package]
name = "evosd"
description = "EverythingOS indexing daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
evos-core.workspace = true
evos-mount.workspace = true
evos-proto.workspace = true
evos-scan.workspace = true
parking_lot = "0.12"
sd-notify = "0.4"
serde.workspace = true
toml = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

# Package `evos`: daemon, command-line client, service and policy files.
# Built by scripts/package.sh after a release build of the workspace.
[package.metadata.deb]
name = "evos"
maintainer = "doriav <doriav20@gmail.com>"
copyright = "2026, doriav"
license-file = ["../../LICENSE", "0"]
extended-description = """\
EverythingOS indexes every local filesystem and network share and finds \
files by name instantly, like Everything on Windows. Local disks are \
followed live through fanotify; SMB, NFS and SSHFS shares are mounted on \
request and kept fresh with change notifications and adaptive sweeps."""
section = "utils"
priority = "optional"
depends = "$auto, cifs-utils, nfs-common"
recommends = "sshfs, polkitd"
conf-files = ["/etc/evos/evosd.toml"]
maintainer-scripts = "../../packaging/debian/evos"
assets = [
    ["target/release/evosd", "usr/bin/", "755"],
    ["target/release/evos", "usr/bin/", "755"],
    ["../../packaging/systemd/evosd.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/polkit/org.evos.policy", "usr/share/polkit-1/actions/", "644"],
    ["../../packaging/config/evosd.toml", "etc/evos/evosd.toml", "644"],
    ["../../README.md", "usr/share/doc/evos/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "evos"
# Explicit sonames: automatic scanning records the build host's libraries.
auto-req = "no"
summary = "Instant file search for Linux, including network shares"
license = "MIT"
assets = [
    { source = "target/release/evosd", dest = "/usr/bin/evosd", mode = "755" },
    { source = "target/release/evos", dest = "/usr/bin/evos", mode = "755" },
    { source = "../../packaging/systemd/evosd.service", dest = "/usr/lib/systemd/system/evosd.service", mode = "644" },
    { source = "../../packaging/polkit/org.evos.policy", dest = "/usr/share/polkit-1/actions/org.evos.policy", mode = "644" },
    { source = "../../packaging/config/evosd.toml", dest = "/etc/evos/evosd.toml", mode = "644", config = "noreplace" },
    { source = "../../README.md", dest = "/usr/share/doc/evos/README.md", mode = "644", doc = true },
]
post_install_script = "if [ -d /run/systemd/system ]; then systemctl daemon-reload; systemctl enable evosd.service; systemctl restart evosd.service; fi || true"
pre_uninstall_script = "if [ $1 -eq 0 ] && [ -d /run/systemd/system ]; then systemctl disable --now evosd.service; fi || true"
post_uninstall_script = "if [ -d /run/systemd/system ]; then systemctl daemon-reload; fi || true"

[package.metadata.generate-rpm.requires]
"libc.so.6()(64bit)" = "*"
cifs-utils = "*"
nfs-utils = "*"
