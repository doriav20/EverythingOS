# EverythingOS development, test, packaging and run environment.
#
#   docker compose run --rm dev cargo test --workspace
#
# Services are grouped by profile; `docker compose run <service>` enables the
# service's profile automatically.

name: evos

x-dev: &dev
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: evos-dev:latest
  working_dir: /work
  volumes:
    - .:/work
    # Keep build output and the crate cache in named volumes: much faster than
    # writing through the host bind mount, and survives container restarts.
    - target:/target
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
  # fanotify filesystem marks and kernel mounts need CAP_SYS_ADMIN.
  privileged: true

services:
  dev:
    <<: *dev
    profiles: ["dev"]

  # --- packages: docker compose --profile package run --rm package [deb|rpm|tarball] ---
  package:
    <<: *dev
    build:
      context: .
      dockerfile: docker/Dockerfile.package
    image: evos-package:latest
    profiles: ["package"]
    environment:
      DIST: /work/dist
    entrypoint: ["scripts/package.sh"]
    command: ["all"]

  package-arch:
    image: archlinux:latest
    profiles: ["package"]
    working_dir: /work
    volumes:
      - .:/work
    command: ["bash", "packaging/arch/build-in-container.sh"]

  # --- try it without installing: docker compose --profile run up -d ---
  # The daemon joins the host's mount namespace, so it indexes the host
  # with real paths and its socket appears in the host's /run/evos.
  evosd:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    image: evos-runtime:latest
    profiles: ["run"]
    privileged: true
    pid: host
    # Kernel SMB/NFS mounts live in the network namespace that made them.
    network_mode: host
    restart: unless-stopped
    volumes:
      - /run/evos:/run/evos
      - ./packaging/run/evosd.toml:/etc/evos/evosd.toml:ro
    command: ["evosd", "--host-mount-namespace"]

  # The desktop client in a browser: http://localhost:8080
  gui:
    image: evos-runtime:latest
    profiles: ["run"]
    depends_on: [evosd]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /run/evos:/run/evos
    command:
      - sh
      - -c
      - gtk4-broadwayd --port 8080 --address 0.0.0.0 :0 & sleep 1; GDK_BACKEND=broadway BROADWAY_DISPLAY=:0 exec evos-gtk

  # --- end-to-end tests: docker compose --profile test run --rm e2e ---
  samba:
    build: docker/samba
    profiles: ["test"]
    volumes:
      - testdata:/data
    command: ["sh", "-c", "mkdir -p /data/smb && exec smbd --foreground --no-process-group --debug-stdout"]

  nfs:
    build: docker/nfs
    profiles: ["test"]
    # The VFS backend uses file handles (open_by_handle_at).
    privileged: true
    volumes:
      - testdata:/data
    command: ["sh", "-c", "mkdir -p /data/nfs && exec ganesha.nfsd -F -L /dev/stdout -f /etc/ganesha/ganesha.conf"]

  e2e:
    <<: *dev
    profiles: ["test"]
    depends_on: [samba, nfs]
    volumes:
      - .:/work
      - target:/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - testdata:/server
    environment:
      E2E_FILES: ${E2E_FILES:-100000}
      E2E_DIRS: ${E2E_DIRS:-5000}
    command: ["bash", "tests/e2e/run.sh"]

volumes:
  target:
  cargo-registry:
  cargo-git:
  testdata:
