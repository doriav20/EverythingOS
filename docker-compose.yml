# EverythingOS development, test, packaging and run environment.
#
#   docker compose run --rm dev cargo test --workspace
#
# Services are grouped by profile; `docker compose run <service>` enables the
# service's profile automatically.

name: evos

x-dev: &dev
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: evos-dev:latest
  working_dir: /work
  volumes:
    - .:/work
    # Keep build output and the crate cache in named volumes: much faster than
    # writing through the host bind mount, and survives container restarts.
    - target:/target
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
  # fanotify filesystem marks and kernel mounts need CAP_SYS_ADMIN.
  privileged: true

services:
  dev:
    <<: *dev
    profiles: ["dev"]

  # --- end-to-end tests: docker compose --profile test run --rm e2e ---
  samba:
    build: docker/samba
    profiles: ["test"]
    volumes:
      - testdata:/data
    command: ["sh", "-c", "mkdir -p /data/smb && exec smbd --foreground --no-process-group --debug-stdout"]

  nfs:
    build: docker/nfs
    profiles: ["test"]
    # The VFS backend uses file handles (open_by_handle_at).
    privileged: true
    volumes:
      - testdata:/data
    command: ["sh", "-c", "mkdir -p /data/nfs && exec ganesha.nfsd -F -L /dev/stdout -f /etc/ganesha/ganesha.conf"]

  e2e:
    <<: *dev
    profiles: ["test"]
    depends_on: [samba, nfs]
    volumes:
      - .:/work
      - target:/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - testdata:/server
    environment:
      E2E_FILES: ${E2E_FILES:-100000}
      E2E_DIRS: ${E2E_DIRS:-5000}
    command: ["bash", "tests/e2e/run.sh"]

volumes:
  target:
  cargo-registry:
  cargo-git:
  testdata:
