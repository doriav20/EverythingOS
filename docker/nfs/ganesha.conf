NFS_CORE_PARAM {
    Protocols = 4;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Enable_UDP = false;
}

NFSV4 {
    # No 90 s grace period after start.
    Graceless = true;
}

EXPORT {
    Export_Id = 1;
    Path = /data/nfs;
    Pseudo = /export;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    # Changes made directly on the server disk must be visible at once;
    # a kernel NFS server does not cache attributes like ganesha does.
    Attr_Expiration_Time = 0;
    FSAL {
        Name = VFS;
    }
}

LOG {
    Default_Log_Level = WARN;
}
