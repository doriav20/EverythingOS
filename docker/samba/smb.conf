[global]
    workgroup = WORKGROUP
    server role = standalone server
    server min protocol = SMB2_10
    map to guest = Bad User
    disable netbios = yes
    smb ports = 445
    log level = 1
    # Change notifications for SMB clients and for local writes (inotify).
    change notify = yes
    kernel change notify = yes

[share]
    path = /data/smb
    read only = no
    guest ok = yes
    force user = root
    create mask = 0644
    directory mask = 0755
